<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Values — big numbers</title>
<link rel="stylesheet" href="card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; gap: 16px; }
  .row .meta { color: var(--ink-faint); font-size: 11px; min-width: 84px; }
  .v36 { font-size: 36px; }
  .v28 { font-size: 28px; }
  .v18 { font-size: 18px; }
  .v15 { font-size: 15px; }
</style>
</head>
<body>
<div class="card">
  <span class="label">value · jetbrains mono 300 · tnum · -0.04em</span>
  <div class="stack">
    <div class="row">
      <span class="meta">36 · hero</span>
      <span class="value v36">72<small>%</small></span>
      <span class="value v36">12:04<small>am</small></span>
    </div>
    <div class="row">
      <span class="meta">28 · large</span>
      <span class="value v28">78<small>%</small></span>
      <span class="value v28">1h 12m</span>
    </div>
    <div class="row">
      <span class="meta">18 · mid</span>
      <span class="value v18">68<small>%</small></span>
      <span class="value v18">3 widgets</span>
    </div>
    <div class="row">
      <span class="meta">15 · inline</span>
      <span class="value v15">72<small>%</small></span>
      <span class="value v15">ready</span>
    </div>
  </div>
</div>
</body>
</html>
