<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Composer</title>
<link rel="stylesheet" href="card.css">
<style>
  .wrap {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-top: 1px solid var(--line);
  }
  .composer .prompt {
    color: var(--ink-soft);
    font-family: var(--font-mono);
    font-size: 13px;
  }
  .composer input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--ink-200);
    font: inherit;
    font-size: 13px;
  }
  .composer .caret {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--ink-200);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }
  .hint {
    display: flex; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.06em;
  }
  .hint kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 1px 5px;
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="card">
  <span class="label">composer · prompt prefix · blinking caret · no chat bubble</span>
  <div class="wrap">
    <div class="composer">
      <span class="prompt">›</span>
      <input value="add a widget that shows my cpu temp" />
      <span class="caret"></span>
    </div>
    <div class="hint">
      <span>review changes after the agent finishes</span>
      <span><kbd>⌘</kbd> <kbd>↵</kbd> send</span>
    </div>
  </div>
</div>
</body>
</html>
