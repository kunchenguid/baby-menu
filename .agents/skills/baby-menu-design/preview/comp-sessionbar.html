<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SessionBar</title>
<link rel="stylesheet" href="card.css">
<style>
  .bar {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 10px 12px 10px 14px;
    display: grid;
    grid-template-columns: 14px 1fr auto auto;
    gap: 10px;
    align-items: center;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
    justify-self: center;
  }
  .bar.pending { color: var(--signal-live); }
  .bar.saved   { color: var(--signal-live); }
  .bar.blocked { color: var(--signal-pending); }
  .bar.saved .dot { animation: fadeOut 1.6s var(--ease-in-out) 1.4s forwards; }
  @keyframes fadeOut { to { opacity: 0.35; box-shadow: none; } }

  .msg {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
    color: var(--ink-strong);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .msg .hint { font-size: 11px; color: var(--ink-soft); font-weight: var(--weight-reg); }

  button {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: var(--weight-med);
    padding: 4px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-200);
    cursor: pointer;
  }
  .btn-primary { background: var(--ink-100); color: #0B0B0C; border-color: var(--ink-100); }
  .btn-danger  { color: var(--signal-error); border-color: rgba(255,106,122,0.35); }
  .btn-ghost   { border-color: transparent; color: var(--ink-soft); }

  .stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div class="card">
  <span class="label">sessionbar · diff summary · no commits, files, or git</span>
  <div class="stack">

    <div class="bar pending">
      <span class="dot"></span>
      <div class="msg">Added the cpu extension<span class="hint">keep it, or undo</span></div>
      <button class="btn-primary">Keep</button>
      <button class="btn-danger">Undo</button>
    </div>

    <div class="bar saved">
      <span class="dot"></span>
      <div class="msg">Undone</div>
      <button class="btn-ghost">Dismiss</button>
      <span></span>
    </div>

    <div class="bar blocked">
      <span class="dot"></span>
      <div class="msg">Finish this change first<span class="hint">keep or undo before asking again</span></div>
      <button class="btn-ghost">Dismiss</button>
      <span></span>
    </div>

  </div>
</div>
</body>
</html>
