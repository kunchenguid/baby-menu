name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      baby-menu-release-created: ${{ steps.release.outputs.release_created }}
      baby-menu-tag-name: ${{ steps.release.outputs.tag_name }}
      baby-menu-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  macos:
    needs: release-please
    if: ${{ needs.release-please.outputs.baby-menu-release-created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TAG_NAME: ${{ needs.release-please.outputs.baby-menu-tag-name }}
      VERSION: ${{ needs.release-please.outputs.baby-menu-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          BABY_MENU_UMAMI_HOST: https://a.kunchenguid.com
          BABY_MENU_UMAMI_WEBSITE_ID: ${{ vars.BABY_MENU_UMAMI_WEBSITE_ID }}
        run: pnpm build

      - name: Package macOS app
        run: pnpm exec electron-builder --mac dir --universal

      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - "release/mac-universal/Baby Menu.app"

      - name: Create DMG
        run: |
          DMG_NAME="Baby-Menu-${VERSION}-universal.dmg"
          hdiutil create -volname "Baby Menu" \
            -srcfolder "release/mac-universal/Baby Menu.app" \
            -ov -format UDZO "release/${DMG_NAME}"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"
          echo "DMG_PATH=release/${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" "$DMG_PATH" --clobber

      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"

      - name: Update Homebrew Cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/kunchenguid/homebrew-tap.git" "$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$RUNNER_TEMP/homebrew-tap/Casks"
          cat > "$RUNNER_TEMP/homebrew-tap/Casks/baby-menu.rb" << CASK_EOF
          cask "baby-menu" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/kunchenguid/baby-menu/releases/download/${TAG_NAME}/Baby-Menu-${VERSION}-universal.dmg"
            name "Baby Menu"
            desc "Menu-bar app that writes its own widgets"
            homepage "https://github.com/kunchenguid/baby-menu"

            depends_on macos: ">= :ventura"

            app "Baby Menu.app"
            uninstall quit: "com.kunchenguid.baby-menu"

            uninstall_preflight do
              next unless system("/usr/bin/pgrep", "-x", "Baby Menu", out: File::NULL, err: File::NULL)

              system_command "/usr/bin/nohup", args: ["/bin/sh", "-c", <<~RELAUNCH_SCRIPT], must_succeed: false
                (
                  while [ -e "#{appdir}/Baby Menu.app" ]; do
                    /bin/sleep 1
                  done

                  for _ in \$(/usr/bin/seq 1 60); do
                    if [ -x "#{appdir}/Baby Menu.app/Contents/MacOS/Baby Menu" ]; then
                      /usr/bin/open -a "#{appdir}/Baby Menu.app"
                      exit 0
                    fi
                    /bin/sleep 1
                  done
                ) >/dev/null 2>&1 &
              RELAUNCH_SCRIPT
            end

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Baby Menu.app"],
                             must_succeed: false
            end

            zap trash: [
              "~/.baby-menu",
              "~/Library/Preferences/com.kunchenguid.baby-menu.plist",
            ]
          end
          CASK_EOF
          cd "$RUNNER_TEMP/homebrew-tap"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/baby-menu.rb
          if ! git diff --cached --quiet; then
            git commit -m "baby-menu ${VERSION}"
            git push
          fi
