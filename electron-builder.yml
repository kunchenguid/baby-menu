appId: com.kunchenguid.baby-menu
productName: Baby Menu
copyright: Copyright © 2026 Kun Chen

directories:
  output: release

files:
  - out/**
  - package.json

extraResources:
  - from: extensions
    to: extensions-template
    filter:
      - AGENTS.md
      - babymenu-env.d.ts
      - recipes/**
      - hello-world/**
  - from: assets/tray
    to: tray
    filter:
      - baby_menuTemplate*.png

asar: true

# The clean-room ACP adapters are spawned as standalone Node processes (via
# Electron-as-node) and cannot be read from inside app.asar, so keep them
# unpacked alongside the archive.
asarUnpack:
  - out/adapters/**

mac:
  category: public.app-category.developer-tools
  icon: assets/app-icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/{@esbuild/**,esbuild/**,@tailwindcss/oxide-*/**,lightningcss-*/**,lightningcss/**}

dmg:
  artifactName: Baby-Menu-${version}-universal.dmg
