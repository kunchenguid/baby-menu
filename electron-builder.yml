appId: com.kunchenguid.baby-menu
productName: Baby Menu
copyright: Copyright © 2026 Kun Chen

directories:
  output: release

files:
  - out/**
  - package.json

extraResources:
  - from: extensions
    to: extensions-template
    filter:
      - AGENTS.md
      - babymenu-env.d.ts
      - recipes/**
      - hello-world/**
      - kimi-code-quota/**
  - from: assets/tray
    to: tray
    filter:
      - baby_menuTemplate*.png
      - baby_menu.png
      - baby_menu@2x.png

asar: true

# The clean-room ACP adapters are spawned as standalone Node processes (via
# Electron-as-node) and cannot be read from inside app.asar, so keep them
# unpacked alongside the archive.
asarUnpack:
  - out/adapters/**

mac:
  category: public.app-category.developer-tools
  icon: assets/app-icon.icns
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/{@esbuild/**,esbuild/**,@tailwindcss/oxide-*/**,lightningcss-*/**,lightningcss/**,@earendil-works/pi-tui/**}

# Windows packaging is unsigned for overnight MVP (G22). Real `pnpm package:win`
# is expected to run on a Windows host / windows-latest CI, not as a Linux gate.
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  # G22: unsigned overnight; SmartScreen warnings expected on local smoke.
  sign: null
  verifyUpdateCodeSignature: false

nsis:
  artifactName: Baby-Menu-${version}-win-x64.exe
  oneClick: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: Baby-Menu-${version}-win-x64-portable.exe

dmg:
  artifactName: Baby-Menu-${version}-universal.dmg
