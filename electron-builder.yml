appId: com.kunchenguid.baby-menu
productName: Baby Menu
copyright: Copyright © 2026 Kun Chen

directories:
  output: release

files:
  - out/**
  - package.json
  # esbuild builds adapters before packaging. At runtime Baby Menu imports only
  # acpx/runtime, whose published entry cannot reach acpx's CLI-only tsx path;
  # tests/acpx-runtime-dependencies.test.ts locks that dependency boundary.
  - '!node_modules/esbuild/**'
  - '!node_modules/@esbuild/**'

extraResources:
  - from: extensions
    to: extensions-template
    filter:
      - AGENTS.md
      - babymenu-env.d.ts
      - recipes/**
      - hello-world/**
  - from: assets/tray
    to: tray
    filter:
      - baby_menu*.png

asar: true

# The clean-room ACP adapters are spawned as standalone Node processes (via
# Electron-as-node) and cannot be read from inside app.asar, so keep them
# unpacked alongside the archive.
asarUnpack:
  - out/adapters/**

mac:
  category: public.app-category.developer-tools
  icon: assets/app-icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: true
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/{@tailwindcss/oxide-*/**,lightningcss-*/**,lightningcss/**}

linux:
  target:
    - AppImage
    - deb
    - rpm
    - pacman
  # The production gate in src/main/app.ts matches basename(exe) exactly, and
  # the documented Hyprland windowrule matches class:^(baby-menu)$.
  executableName: baby-menu
  # app-builder-lib@26.8.2's LinuxTargetHelper.js unconditionally derives the desktop
  # entry's Categories from this top-level category (overwriting any desktop.entry.
  # Categories), so the trailing ";Development" here is what actually reaches the
  # generated Categories=Utility;Development; value.
  category: Utility;Development
  synopsis: Menu-bar app that writes its own widgets
  maintainer: Kun Chen <kunchenguid@users.noreply.github.com>
  # electron-builder resizes this one PNG for every target, so there is no
  # generated icon directory and no build-time rsvg or imagemagick dependency.
  icon: assets/app-icon-512.png
  artifactName: baby-menu-${version}-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: baby-menu

dmg:
  artifactName: Baby-Menu-${version}-universal.dmg
