allowBuilds:
  '@google/genai': false
  electron: true
  electron-winstaller: false
  esbuild: true
  protobufjs: false

overrides:
  postcss: ^8.5.15

# Install prebuilt native binaries for the host plus macOS (universal) and
# Windows x64 so `pnpm package:win` from WSL/Linux still ships
# lightningcss/oxide win32 natives (missing them crashes main process at boot).
# "current" keeps the host platform's binaries for local dev.
supportedArchitectures:
  os:
    - current
    - darwin
    - win32
  cpu:
    - current
    - x64
    - arm64
