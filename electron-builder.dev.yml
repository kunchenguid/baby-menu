# Local/dev packaging config. CI release builds use electron-builder.yml directly.
# A distinct appId + productName keeps locally-built bundles from colliding with
# the installed (cask) app in macOS LaunchServices, so `open -a "Baby Menu"` and
# login items always resolve to the released /Applications copy instead of a
# stale local build.
extends: ./electron-builder.yml
appId: com.kunchenguid.baby-menu.dev
productName: Baby Menu Dev

# Local packages deliberately remain ad-hoc signed and are never notarized.
mac:
  identity: null
  notarize: false
